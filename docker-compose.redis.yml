# Chỉ Redis — dùng khi chạy API/worker local, không cần full stack.
# Usage: docker compose -f docker-compose.redis.yml up -d

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

volumes:
  redisdata:
