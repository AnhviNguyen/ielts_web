# Reverse proxy for Docker Compose (HTTP only — add SSL at host/load balancer in real prod)
upstream linguaielts_api {
    server api:8000;
}

upstream linguaielts_frontend {
    server frontend:80;
}

upstream linguaielts_minio {
    server minio:9000;
}

server {
    listen 80;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass         http://linguaielts_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass         http://linguaielts_api/uploads/;
        proxy_set_header   Host $host;
    }

    location /media/ {
        proxy_pass         http://linguaielts_minio/linguaielts/;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=86400";
    }

    location /audio/ {
        proxy_pass         http://linguaielts_api/audio/;
    }

    location /images/ {
        proxy_pass         http://linguaielts_api/images/;
    }

    location / {
        proxy_pass         http://linguaielts_frontend/;
        proxy_set_header   Host $host;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
